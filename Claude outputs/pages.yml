# Refreshes data/snapshot.json from GitHub and deploys the site to GitHub Pages.
# Visitors only ever read the snapshot from this site — they never call the GitHub API.
#
# One-time setup: repo Settings → Pages → "Build and deployment" → Source: GitHub Actions.
name: Refresh data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # every hour at :17 (off the top of the hour, when GitHub queues are busiest)
  workflow_dispatch:        # "Run workflow" button in the Actions tab for an instant refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch README + repos into data/snapshot.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # If GitHub is briefly unavailable, keep the committed snapshot and still deploy.
        run: node scripts/build-snapshot.mjs || echo "::warning::snapshot refresh failed — deploying the previous snapshot"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
